<!DOCTYPE html>
<html>

<head>
    <title>Configurações | WebDOCs</title>

    <!-- SCRIPT -->
        <script>
            window.BASE_URL = location.hostname.includes('github.io')
                ? '/SistemaAssessoria/'
                : '/';

            document.write(`
                <!-- HEAD, FAVICON E ÍCONES -->
                    <script type="module" src="${window.BASE_URL}scripts/sistema/head.js"><\/script> 
                <!-- NAVDRAWER -->
                    <script type="module" src="${window.BASE_URL}scripts/sistema/navdrawer/main.js"><\/script>
                <!-- HEADER -->
                    <script type="module" src="${window.BASE_URL}scripts/sistema/header/main.js"><\/script>
                <!-- TOOLTIP -->
                    <script src="${window.BASE_URL}scripts/sistema/tooltip.js"><\/script>
                <!-- TEMA -->
                    <script src="${window.BASE_URL}scripts/sistema/tema.js"><\/script>
                    <script>(() => {if (localStorage.getItem('theme') === 'dark') {document.documentElement.setAttribute('data-theme', 'dark');}})();<\/script>
                
                <!-- SISTEMA -->
                    <link rel="stylesheet" href="${window.BASE_URL}estilos/sistema.css">
            `);
        </script>
    
    <!-- MATERIAL WEB -->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <script type="importmap">
            {"imports":{"@material/web/": "https://esm.run/@material/web/"}}
        </script>
        <script type="module">
            import '@material/web/all.js';
            import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
            document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
        </script>
</head>

<body>
    <header id="header"></header>

    <div id="conteudo">
        <div id="navdrawer" class="expanded"></div>
        
        <div class="sistema-pagina expanded mono">

            <h1 class="mono">Configurações</h1>

            <div class="formularios">
                <div class="area-boxes mono config">
                    <div class="base-box config top">
                        <h3>Tema Escuro </h3>
                        <md-switch icons id="i-tema"></md-switch>
                    </div>

                    <div class="base-box config bot">
                        <h3>Sistema em desenvolvimento </h3>
                        <button class="filled icon">
                            <span class="material-symbols-rounded">construction</span>
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</body>

</html>
