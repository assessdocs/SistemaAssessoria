<!DOCTYPE html>
<html>

<head>
    <title>Configurações | WebDOCs</title>

    <!-- SCRIPT -->
        <script>
            window.BASE_URL = location.hostname.includes('github.io')
                ? '/SistemaAssessoria/'
                : '/';

            document.write(`
                <script type="module" src="${window.BASE_URL}scripts/sistema/head.js"><\/script> <!-- HEAD, FAVICON E ÍCONES -->
                <script type="module" src="${window.BASE_URL}scripts/sistema/navdrawer/main.js"><\/script> <!-- NAVDRAWER -->
                <script src="${window.BASE_URL}scripts/sistema/assessoria.js"><\/script> <!-- DADOS DA ASSESSORIA -->
                <script src="${window.BASE_URL}scripts/sistema/tooltip.js"><\/script> <!-- TOOLTIP -->

                <link rel="stylesheet" href="${window.BASE_URL}estilos/sistema.css"> <!-- SISTEMA -->
            `);
        </script>
    
    <!-- MATERIAL WEB -->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <script type="importmap">
            {"imports":{"@material/web/": "https://esm.run/@material/web/"}}
        </script>
        <script type="module">
            import '@material/web/all.js';
            import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
            document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
        </script>
</head>

<body>
    <div class="conteudo">

        <header id="pagina">
            <div class="cabecalho-div"></div>

            <span id="sistema-assessoria" class="assessoria-nome"></span>
        </header>

        <div class="sistema-pagina">
            <h1>Configurações</h1>
            <div class="formularios">
                <div class="area-boxes" style="grid-template-columns: 492px;">
                <div class="base-box" style="display:flex; justify-content: center; flex-direction: column; gap: 12px; align-items: center;">
                    <span class="material-symbols-rounded">construction</span>
                    <h2 style="margin: 0px;">Sistema em desenvolvimento</h2>
                </div>
            </div>

            </div>
        </div>
    </div>
</body>

</html>
