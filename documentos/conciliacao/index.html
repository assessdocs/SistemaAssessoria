<!DOCTYPE html>
<html>

<head>
    <title>Conciliação | WebDOCs</title>

    <!-- SISTEMA -->
        <script type="module" src="/scripts/sistema/head.js"></script> <!-- HEAD, FAVICON E ÍCONES -->
        <script type="module" src="/scripts/sistema/navdrawer/main.js"></script> <!-- NAVDRAWER -->
        <script src="/scripts/sistema/assessoria.js"></script> <!-- DADOS DA ASSESSORIA -->
        <script src="/scripts/sistema/tooltip.js"></script> <!-- TOOLTIP -->

    <!-- ESTILOS -->
        <link rel="stylesheet" href="/estilos/sistema.css"> <!-- SISTEMA -->

        <link rel="stylesheet" href="/estilos/exportar.css"> <!-- MENU EXPORTAR -->

        <link rel="stylesheet" href="/estilos/consulta.css"> <!-- CONSULTA -->

        <link rel="stylesheet" href="./conciliacao.css"> <!-- DOCUMENTO -->
</head>

<body id="conciliacao">
    <div class="conteudo" id="conteudo">
        <header id="pagina">
            <span id="sistema-assessoria" class="assessoria-nome"></span>
        </header>
        <div class="sistema-pagina">

            <h1>Conciliação (em construção)</h1>
            
            <div class="formularios">
                <div class="area-boxes">
                    <div class="box-duplo">
                        <div class="base-box">
                            <div class="h2-ativar" id="h2-versaomanual">
                                <h2>Versão Manual</h2>
                                <label class="md-switch">
                                    <input type="checkbox" id="i-versaomanual">
                                    <span class="track">
                                        <span class="thumb"></span>
                                    </span>
                                </label>
                            </div>
                            <div class="base-boxcampos" id="versaomanual">
                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-cnpj">CNPJ</label>
                                        <span class="material-symbols-rounded tooltip" data-tooltip="Utilize somente números, pois o sistema irá pontuar automaticamente.">info</span>
                                    </div>
                                    <input class="input" id="i-cnpj" placeholder="00.000.000/0000-00">
                                </div>
                                
                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-razaosocial">Razão Social</label>
                                    </div>
                                    <input class="input" id="i-razaosocial" placeholder="Nome da Empresa">
                                </div>

                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-logradouro">Logradouro</label>
                                    </div>
                                    <input class="input" id="i-logradouro" placeholder="Rua, Avenida, Travessa...">
                                </div>

                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-numero">Número</label>
                                        <span class="material-symbols-rounded tooltip" data-tooltip="Utilize somente números.">info</span>
                                    </div>
                                    <input class="input" id="i-numero" placeholder="Nº (00)">
                                </div>

                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-bairro">Número</label>
                                    </div>
                                    <input class="input" id="i-bairro" placeholder="Bairro">
                                </div>

                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-cidade">Cidade</label>
                                    </div>
                                    <input class="input" id="i-cidade" placeholder="Cidade">
                                </div>

                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-cep">CEP</label>
                                        <span class="material-symbols-rounded tooltip" data-tooltip="Utilize somente números.">info</span>
                                    </div>
                                    <input class="input" id="i-cep" placeholder="00.000-000">
                                </div>
                            </div>
                        </div>
                        
                        <div class="base-box" id="consulta"></div>

                        <div class="base-box" id="resultado-consulta"></div>
                    </div>
                    <div class="box-duplo">
                        <div class="base-box">
                            <h2>Documento</h2>
                            <div class="base-boxcampos">
                                
                                <div class="campo">
                                    <div class="label">
                                        <label class="label-campo" for="i-telefone">Telefone do Cliente</label>
                                    </div>
                                    <input class="input" id="i-telefone" placeholder="(00) 90000-0000" type="tel">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            <div class="menu-inferior">
                <div class="confirmacao">
                    <label for="confirmacao" class="label-confirmacao">
                        Todos os campos foram preenchidos?
                        <input type="checkbox" id="confirmacao">
                    </label>
                </div>
                
                <button id="exportar"></button>
            </div>
            </div>
        </div>
    </div>
    <div id="documento" style="display: none;">
        <div class="pagina" id="pagina1">
            
        </div>
    </div>

    <!-- CONSULTA -->
        <script src="/scripts/consulta.js"></script>

    <!-- EXPORTAÇÃO -->
        <script src="/scripts/exportacao/exportar.js"></script>
        <script src="/scripts/exportacao/impressao.js"></script>
        <script src="/scripts/exportacao/titulo.js"></script>

    <!-- OPCIONAIS -->
        <script src="/scripts/formatacao/cnpj.js"></script>
</body>

</html>
