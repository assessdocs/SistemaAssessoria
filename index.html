<!DOCTYPE html>
<html>

<head>
    <title>WebDOCs Assessoria</title>
    

    <!-- SCRIPT -->
        <script>
            window.BASE_URL = location.hostname.includes('github.io')
                ? '/SistemaAssessoria/'
                : '/';

            document.write(`
                <!-- HEAD, FAVICON E ÍCONES -->
                    <script type="module" src="${window.BASE_URL}scripts/sistema/head.js"><\/script> 
                <!-- NAVDRAWER -->
                    <script type="module" src="${window.BASE_URL}scripts/sistema/navdrawer/main.js"><\/script>
                <!-- DADOS DA ASSESSORIA -->
                    <script src="${window.BASE_URL}scripts/sistema/assessoria.js"><\/script>
                <!-- TOOLTIP -->
                    <script src="${window.BASE_URL}scripts/sistema/tooltip.js"><\/script>
                
                
                <!-- SISTEMA -->
                    <link rel="stylesheet" href="${window.BASE_URL}estilos/sistema.css">
            `);

            document.write(`
                <!-- CONSULTA -->
                    <script src="${window.BASE_URL}scripts/consulta-home.js"><\/script>
            `)
        </script>

    <!-- MATERIAL WEB -->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <script type="importmap">
            {"imports":{"@material/web/": "https://esm.run/@material/web/"}}
        </script>
        <script type="module">
            import '@material/web/all.js';
            import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
            document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
        </script>
</head>

<body class="expanded">
    <header id="navdrawer" class="expanded"></header>

    <div class="conteudo">

        <header id="pagina" class="expanded">
            <div class="cabecalho-div"></div>

            <span id="sistema-assessoria" class="assessoria-nome"></span>
        </header>

        <div class="sistema-pagina">
            <h1>Painel Inicial</h1>
            <div class="formularios">
                <div class="area-boxes">
                    <div class="base-box">
                        <div class="box-header">
                            <span class="material-symbols-rounded">keep</span>
                            <h2>Fixados</h2>
                        </div>

                        <div class="base-boxcampos grupo">
                            
                            <a class="input-home top" href="./documentos/orcamento/">
                                Orçamento<span class="material-symbols-rounded">arrow_right</span>
                            </a>

                            <a class="input-home center" href="./documentos/eve/">
                                EVE e SWOT<span class="material-symbols-rounded">arrow_right</span>
                            </a>

                            <a class="input-home center" href="./documentos/business/">
                                Business<span class="material-symbols-rounded">arrow_right</span>
                            </a>

                            <a class="input-home center" href="./documentos/dmpl/">
                                DMPL<span class="material-symbols-rounded">arrow_right</span>
                            </a>

                            <a class="input-home bot" href="./documentos/notafiscal/">
                                Nota Fiscal<span class="material-symbols-rounded">arrow_right</span>
                            </a>
                        </div>
                    </div>
                    
                    <div class="box-duplo">
                        <div class="base-box" id="consulta"></div>
                        <div class="base-box" id="resultado-consulta" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
