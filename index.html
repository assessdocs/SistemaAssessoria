<!DOCTYPE html>
<html>

<head>
    <title>WebDOCs Assessoria</title>

    <!-- SCRIPT -->
        <script>
            window.BASE_URL = location.hostname.includes('github.io')
                ? '/SistemaAssessoria/'
                : '/';

            document.write(`
                <script type="module" src="${window.BASE_URL}scripts/sistema/head.js"><\/script> <!-- HEAD, FAVICON E ÍCONES -->
                <script type="module" src="${window.BASE_URL}scripts/sistema/navdrawer/main.js"><\/script> <!-- NAVDRAWER -->
                <script src="${window.BASE_URL}scripts/sistema/assessoria.js"><\/script> <!-- DADOS DA ASSESSORIA -->
                <script src="${window.BASE_URL}scripts/sistema/tooltip.js"><\/script> <!-- TOOLTIP -->

                <link rel="stylesheet" href="${window.BASE_URL}estilos/sistema.css"> <!-- SISTEMA -->
                <link rel="stylesheet" href="${window.BASE_URL}estilos/inicio.css">
            `);
        </script>

    <!-- MATERIAL WEB -->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <script type="importmap">
            {"imports":{"@material/web/": "https://esm.run/@material/web/"}}
        </script>
        <script type="module">
            import '@material/web/all.js';
            import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
            document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
        </script>
</head>

<body>
    <div class="conteudo">

        <header id="pagina">
            <div class="cabecalho-div"></div>

            <span id="sistema-assessoria" class="assessoria-nome"></span>
        </header>

        <div class="sistema-pagina">
            <h1>Painel Inicial</h1>
            <div class="sistema-conteudo">
                <div class="area-boxes">
                    <div class="base-box">
                        <div class="box-header">
                            <span class="material-symbols-rounded">keep</span>
                            <h2>Acesso Rápido</h2>
                        </div>
                        <div class="area-campos">
                            <a class="campo" href="./consulta/">
                                Consulta<span class="material-symbols-rounded">arrow_right</span>
                            </a>
                            <a class="campo" href="./documentos/aprovacao/">
                                Aprovação<span class="material-symbols-rounded">arrow_right</span>
                            </a>
                        </div>
                    </div>
                    <div class="base-box">
                    
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
